# Reusable workflow: deploys a delta package to one Databricks environment.
# Called by package-and-deploy.yml for SIT, UAT and PROD.
#
# Environment details:
#   SIT       -> host and target path are hardcoded in the "Set environment details" step.
#   UAT, PROD -> read from GitHub Environment variables DATABRICKS_HOST and TARGET_PATH.
# Every GitHub Environment (SIT, UAT, PROD) still needs these secrets:
#   DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET  (service principal OAuth)
name: Deploy package

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      package_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - name: Set environment details
        env:
          TARGET_ENV: ${{ inputs.environment }}
          VAR_HOST: ${{ vars.DATABRICKS_HOST }}
          VAR_TARGET_PATH: ${{ vars.TARGET_PATH }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            SIT)
              # Hardcoded for testing: SIT uses the same workspace as dev
              HOST="https://adb-4330217265748556.16.azuredatabricks.net"
              TARGET="/Workspace/Users/suganyadevi.natarajan@kumaran.world/wcdw_migration_project/WCDW_POC/SIT"
              ;;
            *)
              HOST="$VAR_HOST"
              TARGET="$VAR_TARGET_PATH"
              ;;
          esac

          if [ -z "$HOST" ] || [ -z "$TARGET" ]; then
            echo "::error::DATABRICKS_HOST or TARGET_PATH is not set for $TARGET_ENV"
            exit 1
          fi

          echo "DATABRICKS_HOST=$HOST" >> "$GITHUB_ENV"
          echo "TARGET_PATH=$TARGET" >> "$GITHUB_ENV"
          echo "$TARGET_ENV -> $HOST : $TARGET"

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_name }}
          path: package

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy changed files
        run: |
          set -euo pipefail
          echo "Deploying to ${{ inputs.environment }} -> $TARGET_PATH"
          cat package/manifest.txt

          if [ -s package/changed.txt ]; then
            databricks workspace mkdirs "$TARGET_PATH"
            databricks workspace import-dir package/files "$TARGET_PATH" --overwrite
          fi

      - name: Remove deleted files
        run: |
          set -uo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Notebooks are stored without their extension, plain files with it
            databricks workspace delete "$TARGET_PATH/$f" 2>/dev/null \
              || databricks workspace delete "$TARGET_PATH/${f%.*}" 2>/dev/null \
              || echo "Not found in target, skipping: $f"
          done < package/deleted.txt
