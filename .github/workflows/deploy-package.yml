# Reusable workflow: deploys a delta package to one Databricks environment.
# Called by package-and-deploy.yml for SIT, UAT and PROD.
#
# Each GitHub Environment (SIT, UAT, PROD) must define:
#   variables: DATABRICKS_HOST  (e.g. https://adb-123.azuredatabricks.net)
#              TARGET_PATH      (e.g. /Workspace/Shared/wcdw_poc)
#   secrets:   DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET  (service principal OAuth)
name: Deploy package

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      package_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      TARGET_PATH: ${{ vars.TARGET_PATH }}
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_name }}
          path: package

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy changed files
        run: |
          set -euo pipefail
          echo "Deploying to ${{ inputs.environment }} -> $TARGET_PATH"
          cat package/manifest.txt

          if [ -s package/changed.txt ]; then
            databricks workspace mkdirs "$TARGET_PATH"
            databricks workspace import-dir package/files "$TARGET_PATH" --overwrite
          fi

      - name: Remove deleted files
        run: |
          set -uo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Notebooks are stored without their extension, plain files with it
            databricks workspace delete "$TARGET_PATH/$f" 2>/dev/null \
              || databricks workspace delete "$TARGET_PATH/${f%.*}" 2>/dev/null \
              || echo "Not found in target, skipping: $f"
          done < package/deleted.txt
